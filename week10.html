<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub User Search</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        font-family: "Yu Gothic", "Hiragino Sans", sans-serif;
        background: linear-gradient(135deg, #f3f4f6, #e0f2fe);
      }
      .card {
        max-width: 700px;
      }
      .user-info {
        min-height: 180px;
      }
      .error-text {
        color: #dc2626;
      }
      .success-text {
        color: #15803d;
      }
    </style>
  </head>
  <body class="min-h-screen flex items-center justify-center p-6">
    <main class="card w-full rounded-2xl bg-white p-8 shadow-xl">
      <h1 class="mb-6 text-2xl font-bold text-center text-gray-800">GitHub ユーザー検索</h1>

      <div class="mb-6 flex gap-3">
        <input
          id="username"
          type="text"
          placeholder="GitHubのユーザー名を入力"
          class="flex-1 rounded-lg border border-gray-300 px-4 py-3 text-base outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
        />
        <button
          id="searchBtn"
          type="button"
          class="rounded-lg bg-blue-600 px-5 py-3 font-semibold text-white transition hover:bg-blue-700"
        >
          検索
        </button>
      </div>

      <div id="result" class="user-info hidden rounded-xl border border-gray-200 bg-gray-50 p-5">
        <div class="flex items-center gap-5">
          <img id="avatar" src="" alt="ユーザーアイコン" class="h-20 w-20 rounded-full border border-gray-200 object-cover" />
          <div>
            <h2 id="name" class="text-xl font-bold text-gray-800">-</h2>
            <p id="bio" class="mt-1 text-sm text-gray-600">-</p>
          </div>
        </div>

        <div class="mt-5 border-t border-gray-200 pt-4">
          <p class="text-sm text-gray-600">フォロワー数</p>
          <p id="followers" class="text-lg font-semibold text-gray-800">-</p>
        </div>
      </div>

      <p id="message" class="mt-4 min-h-[1.5rem] text-sm font-semibold"></p>
    </main>

    <script>
      const usernameInput = document.getElementById('username');
      const searchBtn = document.getElementById('searchBtn');
      const result = document.getElementById('result');
      const avatar = document.getElementById('avatar');
      const name = document.getElementById('name');
      const bio = document.getElementById('bio');
      const followers = document.getElementById('followers');
      const message = document.getElementById('message');

      function setMessage(text, isError = false) {
        message.textContent = text;
        message.className = 'mt-4 min-h-[1.5rem] text-sm font-semibold';
        message.classList.toggle('error-text', isError);
        message.classList.toggle('success-text', !isError);
      }

      async function searchUser() {
        const username = usernameInput.value.trim();

        if (!username) {
          setMessage('GitHubのユーザー名を入力してください。', true);
          result.classList.add('hidden');
          return;
        }

        try {
          const response = await fetch(`https://api.github.com/users/${username}`);

          if (!response.ok) {
            result.classList.add('hidden');
            setMessage('ユーザーが見つかりませんでした', true);
            return;
          }

          const data = await response.json();
          avatar.src = data.avatar_url;
          name.textContent = data.name || '名前なし';
          bio.textContent = data.bio || '自己紹介はありません';
          followers.textContent = data.followers;

          result.classList.remove('hidden');
          setMessage('ユーザー情報を取得しました。', false);
        } catch (error) {
          result.classList.add('hidden');
          setMessage('通信に失敗しました。もう一度お試しください。', true);
        }
      }

      searchBtn.addEventListener('click', searchUser);
      usernameInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          searchUser();
        }
      });


      console.log(fetch("https://jsonplaceholder.typicode.com/users/1"));
// → Promise {<pending>}
    </script>
  </body>
</html>
