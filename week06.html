<!DOCTYPE html>

<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Posse課題：BMI計算ツール</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<main class="max-w-5xl mx-auto">
    <body class="bg-gray-50 p-6 flex justify-center items-center min-h-screen">
    <div class="bg-white w-full mx-auto p-6 mx-auto rounded-lg shadow-lg">
        <h2 class="text-gray-800 font-bold text-xl text-center m-4">BMI計算ツール</h2>
        <p class="text-gray-700 text-sm mb-4 text-center">身長</p>
        <input
        id="height" 
        type="number"
        value="160"
        class="w-full mx-auto rounded-lg px-3 py-2 mb-3 text-center border">
        <p class="text-gray-700 text-sm mb-4 text-center">体重</p>
        <input 
        id="weight"
        type="number"
        value="60"
        class="w-full mx-auto rounded-lg px-3 py-2 mb-3 text-center border">

        <button
        id="calcBtn"
        type="button"
        class="mt-4 w-full bg-amber-700 hover:bg-amber-900 text-white font-bold text-lg rounded-lg py-3 px-2"
        >計算する</button>

        <div class="bg-gray-100 m-4">
            <p class="text-center text-gray-700 text-sm mb-4">BMI</p>
            <div
            id="result"
            class="text-2xl font-bold mb-4">
            </div>
        </div>
    </div>

    <script>
        function calcBmi(height,weight){
            const heightM = height / 100 ;
            return weight / ( heightM * heightM);
        }

        function getJudgment (bmi){
            if ( bmi < 18.5 ){return "瘦せ型";}
            else if (bmi < 25 ){return "普通";}
            else {return "肥満"; }
        }

        const button = document.querySelector("#calcBtn")
        const result = document.querySelector("#result")

        button.addEventListener("click", ()=> {
            const height = Number(document.querySelector("#height").value);
            const weight = Number(document.querySelector("#weight").value);

            const bmi = calcBmi(height,weight);
            const Judgment = getJudgment(bmi);

        })

    </script>
    
</body>

</main>
