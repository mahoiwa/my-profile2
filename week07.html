<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODOリスト</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-white p-4 w-full min-h-screen">
    <h1 class="flex justify-center m-4 font-bold">Todoリスト</h1>
    <div class="flex flex-col items-center">
        <input type="text"
        id="todoInput"
        placeholder="やることを入力" 
        class="w-80 border border-slate-300 m-4 p-4">
        <button id="addBtn" class="text-slate-800 bg-gray-50 hover:shadow-lg rounded-lg m-4 p-4">追加</button>
    </div>

    <div class="w-full max-w-sm mx-auto">
    <ul class="rounded-xl shadow-sm p-4" id="todoList"></ul>
</div>

<script>
    const addButton = document.querySelector("#addBtn")
    const todoInput = document.querySelector("#todoInput")
    const todoList = document.querySelector("#todoList")

    addButton.addEventListener("click", () => {
        const text = todoInput.value;

    if (text === ""){
        return;
    }

    
//liの要素
    const item = document.createElement("li");
    item.className = "flex items-center justify-between bg-gray-50 rounded px-3 py-2";

    const span = document.createElement("span");
    span.textContent = text;
    span.className = "text-sm text-slate-700"

    const doneBtn = document.createElement("button");
        doneBtn.textContent = "完了";
        doneBtn.className = "text-sm text-gray-500 hover:text-red-500";

        doneBtn.addEventListener("click", () => {
            span.classList.toggle("line-through");
            span.classList.toggle("text-gray-400");
        });

        item.appendChild(span);
        item.appendChild(doneBtn);
        todoList.appendChild(item);

        todoInput.value = "";

    });


</script>

  </body>

</html>
